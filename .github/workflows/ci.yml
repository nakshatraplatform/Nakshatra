name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Audit, Lint, Unit Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Public Supabase configuration is inlined into the browser bundle at build time.
    # Keep the configured values in GitHub Actions secrets rather than source control.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.{js,jsx,ts,tsx}', 'next.config.*', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run security:audit

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests and full-source coverage
        run: npm run test:unit:coverage

      - name: Validate Supabase build configuration
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo "NEXT_PUBLIC_SUPABASE_URL is not configured"; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY is not configured"; exit 1; }
          node --input-type=module -e 'new URL(process.env.NEXT_PUBLIC_SUPABASE_URL)'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage
          if-no-files-found: ignore
          retention-days: 14

      - name: Build
        run: npm run build

  browser:
    name: Browser end-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Playwright starts local mock services; no production credentials are needed.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Playwright browser cache
        id: playwright_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      # The browser cache does not include Linux system libraries.
      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright browser
        if: steps.playwright_cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: End-to-end tests
        # Stop within Playwright first so failure traces can be uploaded.
        run: npm run test:e2e -- --global-timeout=900000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  # Preserve the existing required check name and fail closed on every outcome.
  validate:
    name: Lint, Test, Coverage & Build
    needs: [quality, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require validation and browser tests to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$BROWSER_RESULT" = success

  database:
    name: Supabase migrations and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start minimal local Supabase stack
        run: npm run ci:db:start

      - name: Replay migrations from a clean local database
        run: npm run test:db:reset

      - name: Run database tests
        run: npm run test:db

      - name: Generate public database types from the clean local database
        id: database_types
        run: npx supabase gen types typescript --local --schema public > "$RUNNER_TEMP/database.generated.ts"

      - name: Check committed database types for drift
        run: node scripts/check-database-types.mjs "$RUNNER_TEMP/database.generated.ts"

      - name: Upload generated database types for drift diagnosis
        if: ${{ always() && steps.database_types.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: database-types-${{ github.run_id }}
          path: ${{ runner.temp }}/database.generated.ts
          if-no-files-found: error
          retention-days: 7

      - name: Diagnose failed Supabase startup or database verification
        if: failure()
        run: npm run ci:db:diagnose

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop
