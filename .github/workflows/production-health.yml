name: Production Maintenance Health

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

concurrency:
  group: production-maintenance-health
  cancel-in-progress: false

jobs:
  health:
    if: ${{ github.ref == 'refs/heads/main' && vars.PRODUCTION_WORKER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check private maintenance health
        env:
          PRODUCTION_WORKER_SECRET: ${{ secrets.PRODUCTION_WORKER_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test ${#PRODUCTION_WORKER_SECRET} -ge 32 || { echo 'Maintenance health credential is missing'; exit 1; }
          # stdin keeps the credential out of curl's process arguments and logs.
          status="$(printf 'Authorization: Bearer %s\n' "$PRODUCTION_WORKER_SECRET" | curl --silent --show-error --max-time 20 --proto '=https' --header @- --output /dev/null --write-out '%{http_code}' https://www.vivintro.com/api/internal/production-health)"
          test "$status" = 200 || { echo "Maintenance health returned HTTP $status"; exit 1; }

  alert:
    needs: health
    if: ${{ always() && github.ref == 'refs/heads/main' && vars.PRODUCTION_WORKER_ENABLED == 'true' && needs.health.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ALERT_ASSIGNEE: ${{ vars.DIDIT_ALERT_ASSIGNEE }}
    steps:
      - name: Maintain one actionable maintenance alert
        shell: bash
        run: |
          set -euo pipefail
          title='[Operational Alert] Production maintenance needs attention'
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'Production maintenance needs attention in:title' --json number,title --jq 'map(select(.title == "[Operational Alert] Production maintenance needs attention")) | first | .number // empty')"
          if [[ -z "$existing" ]]; then
            body_file="$(mktemp)"
            printf 'Production maintenance health failed or could not be reached. This can indicate missed runs, deferred cleanup, or old/held notification work. No user or provider identifiers are included. Inspect protected health and run evidence: %s\n' "$RUN_URL" > "$body_file"
            args=()
            if [[ -n "$ALERT_ASSIGNEE" ]]; then args+=(--assignee "$ALERT_ASSIGNEE"); fi
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body_file" "${args[@]}"
          fi
