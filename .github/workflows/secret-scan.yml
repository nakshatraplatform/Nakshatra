name: Secret Scan

on:
  pull_request:
    branches: [main, development]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Scan committed changes and history
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318
        with:
          version: 3.97.0
          extra_args: --config=.github/trufflehog.yml --results=verified,unknown,unverified
