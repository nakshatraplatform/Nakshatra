name: Identity Verification Worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: identity-verification-worker-production
  cancel-in-progress: false

jobs:
  process:
    name: Process identity verification work
    if: ${{ github.ref == 'refs/heads/main' && vars.DIDIT_WORKER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: identity-verification-worker-production
    permissions:
      contents: read
    env:
      EXPECTED_SUPABASE_HOST: xizzzczzhqzabcipbgep.supabase.co
      IDENTITY_VERIFICATION_BATCH_SIZE: "25"

    steps:
      - name: Checkout trusted main revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
          cache: npm

      - name: Install production dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Validate isolated worker secrets
        env:
          DIDIT_API_KEY: ${{ secrets.DIDIT_API_KEY }}
          DIDIT_WORKFLOW_ID: ${{ secrets.DIDIT_WORKFLOW_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$DIDIT_API_KEY" || { echo "DIDIT_API_KEY is not configured"; exit 1; }
          [[ "$DIDIT_WORKFLOW_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "DIDIT_WORKFLOW_ID is not configured"; exit 1; }
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL is not configured"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "SUPABASE_SERVICE_ROLE_KEY is not configured"; exit 1; }
          node --input-type=module -e '
            const url = new URL(process.env.SUPABASE_URL);
            const valid = url.protocol === "https:"
              && url.hostname === process.env.EXPECTED_SUPABASE_HOST
              && url.port === ""
              && url.username === ""
              && url.password === ""
              && url.pathname === "/"
              && url.search === ""
              && url.hash === "";
            if (!valid) {
              console.error("SUPABASE_URL does not identify the approved Nakshatra project");
              process.exit(1);
            }
          '

      - name: Process bounded verification batch
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_REPLY_TO_EMAIL: ${{ secrets.RESEND_REPLY_TO_EMAIL }}
          DIDIT_API_KEY: ${{ secrets.DIDIT_API_KEY }}
          DIDIT_WORKFLOW_ID: ${{ secrets.DIDIT_WORKFLOW_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run identity-verification:process

  alert:
    name: Maintain worker failure alert
    needs: process
    if: ${{ always() && github.ref == 'refs/heads/main' && vars.DIDIT_WORKER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      WORKER_RESULT: ${{ needs.process.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ALERT_ASSIGNEE: ${{ vars.DIDIT_ALERT_ASSIGNEE }}

    steps:
      - name: Open the operational alert
        shell: bash
        run: |
          set -euo pipefail
          alert_title="[Operational Alert] Identity verification worker is failing"
          alert_label="ops-worker-failure"
          test -n "$ALERT_ASSIGNEE" || { echo "DIDIT_ALERT_ASSIGNEE is not configured"; exit 1; }

          if ! gh api "repos/$GITHUB_REPOSITORY/labels/$alert_label" >/dev/null 2>&1; then
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/labels" \
              -f name="$alert_label" \
              -f color="B60205" \
              -f description="Trusted identity-verification worker failure" \
              >/dev/null
          fi

          issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label "$alert_label" \
            --search 'Identity verification worker is failing in:title' \
            --json number,title \
            --jq 'map(select(.title == "[Operational Alert] Identity verification worker is failing")) | first | .number // empty')"

          if [[ "$WORKER_RESULT" == "success" ]]; then
            exit 0
          fi

          if [[ -z "$issue_number" ]]; then
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$alert_title" \
              --label "$alert_label" \
              --assignee "$ALERT_ASSIGNEE" \
              --body "The trusted five-minute identity-verification worker did not complete successfully. No candidate or provider identifiers are included in this alert. Review the protected run logs: $RUN_URL"
          fi
