<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f7f5ef;color:#18303b;font-family:Arial,sans-serif">
    <div style="max-width:520px;margin:0 auto;padding:40px 24px">
      <img src="{{ .SiteURL }}/brand/vivintro/vivintro-lockup-stacked-email.png" alt="VivIntro" width="168" style="display:block;width:168px;height:auto;border:0" />
      <h1 style="font-family:Georgia,serif;font-size:30px;font-weight:500">Verify your email</h1>
      <p>Enter this six-digit code on the page you already have open:</p>
      <p style="margin:28px 0;font-size:30px;font-weight:700;letter-spacing:8px">{{ .Token }}</p>
      <p style="color:#667478;font-size:14px">The code expires in 10 minutes. If you did not request this code, you can ignore this email.</p>
    </div>
  </body>
</html>
